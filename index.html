<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Siyah Klon</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>" />
</head>
<body>
  <div class="app">
    <!-- Servers sidebar -->
    <div class="servers">
      <div class="server-icon home active" data-server="home" title="Ana Sayfa">
        <svg width="28" height="20" viewBox="0 0 28 20"><path fill="currentColor" d="M18.5 10c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm-7 0c0 1.1-.9 2-2 2s-2-.9-2-2 .9-2 2-2 2 .9 2 2zm11.5 0c0-4.4-3.6-8-8-8s-8 3.6-8 8c0 3.5 2.2 6.5 5.4 7.6.4.1.6-.2.6-.4v-1.4c-2.2.5-2.7-1.1-2.7-1.1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.2 1.9.9 2.3.7.1-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.2-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8.6-.2 1.3-.3 2-.3s1.4.1 2 .3c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.2 0 3.1-1.9 3.8-3.7 4 .3.3.6.8.6 1.5v2.2c0 .2.2.5.6.4C23.8 16.5 26 13.5 26 10z"/></svg>
      </div>
      <div class="separator"></div>
      <div class="server-icon" data-server="oyun" title="Oyun Dünyası" style="background:#5865f2;">O</div>
      <div class="server-icon" data-server="muzik" title="Müzik & Sohbet" style="background:#eb459e;">M</div>
      <div class="server-icon" data-server="kod" title="Kod & Teknoloji" style="background:#57f287;">K</div>
      <div class="server-icon add" title="Sunucu Ekle">+</div>
    </div>

    <!-- Channels sidebar -->
    <div class="channels">
      <div class="server-header">
        <h2 id="server-name">Ana Sayfa</h2>
        <span class="dropdown">▾</span>
      </div>

      <div class="channel-section">
        <div class="section-header" onclick="toggleSection(this)">
          <span class="arrow">▾</span> METİN KANALLARI
        </div>
        <div class="channel-list" id="text-channels">
          <!-- filled by JS -->
        </div>
      </div>

      <div class="channel-section">
        <div class="section-header" onclick="toggleSection(this)">
          <span class="arrow">▾</span> SES KANALLARI
        </div>
        <div class="channel-list" id="voice-channels">
          <div class="channel voice">
            <span class="icon">🔊</span> Genel
          </div>
          <div class="channel voice">
            <span class="icon">🔊</span> Müzik
          </div>
        </div>
      </div>

      <div class="user-panel">
        <div class="avatar" id="user-avatar">U</div>
        <div class="user-info">
          <div class="username" id="username">Kullanıcı</div>
          <div class="status">Çevrimiçi</div>
        </div>
        <div class="user-controls">
          <button title="Mikrofon" onclick="toggleMute(this)">🎤</button>
          <button title="Kulaklık" onclick="toggleDeafen(this)">🎧</button>
          <button title="Ayarlar" onclick="openSettings()">⚙️</button>
        </div>
      </div>
    </div>

    <!-- Main chat area -->
    <div class="chat">
      <div class="chat-header">
        <div class="channel-name">
          <span class="hash">#</span>
          <span id="current-channel">genel</span>
        </div>
        <div class="header-actions">
          <input type="text" placeholder="Ara..." class="search" />
          <button title="Bildirimler">🔔</button>
          <button title="Sabitle">📌</button>
          <button title="Üyeler" onclick="toggleMembers()">👥</button>
        </div>
      </div>

      <div class="messages" id="messages">
        <!-- messages by JS -->
      </div>

      <div class="message-input-area">
        <div class="input-wrapper">
          <button class="attach" title="Dosya Ekle">+</button>
          <input type="text" id="message-input" placeholder="#genel kanalına mesaj gönder" autocomplete="off" />
          <button class="emoji" title="Emoji">😊</button>
          <button class="send" onclick="sendMessage()">➤</button>
        </div>
      </div>
    </div>

    <!-- Members sidebar -->
    <div class="members" id="members-panel">
      <div class="members-header">Üyeler — <span id="member-count">0</span></div>
      <div class="member-group">
        <div class="group-title">ÇEVRİMİÇİ — <span id="online-count">0</span></div>
        <div id="online-members"></div>
      </div>
      <div class="member-group">
        <div class="group-title">ÇEVRİMDIŞI — <span id="offline-count">0</span></div>
        <div id="offline-members"></div>
      </div>
    </div>
  </div>

  <!-- Settings modal -->
  <div class="modal" id="settings-modal">
    <div class="modal-content">
      <h2>Kullanıcı Ayarları</h2>
      <label>Kullanıcı Adı</label>
      <input type="text" id="settings-username" />
      <label>Avatar Harfi</label>
      <input type="text" id="settings-avatar" maxlength="1" />
      <div class="modal-actions">
        <button onclick="saveSettings()">Kaydet</button>
        <button class="cancel" onclick="closeSettings()">İptal</button>
      </div>
    </div>
  </div>

  <!-- Add server modal -->
  <div class="modal" id="add-server-modal">
    <div class="modal-content">
      <h2>Yeni Sunucu Oluştur</h2>
      <label>Sunucu Adı</label>
      <input type="text" id="new-server-name" placeholder="Örn: Arkadaşlar" />
      <div class="modal-actions">
        <button onclick="createServer()">Oluştur</button>
        <button class="cancel" onclick="closeAddServer()">İptal</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
